# backend/app/policy/rules.yaml
#
# THIS IS SEED DATA, NOT RUNTIME CONFIG.
#
# It is how policy_rules gets its first rows and nothing more. After
# reset_db.py has run once, the table is the only source of truth and M3
# never reads this file -- M1 fetches the rows via RuleRepo.all() and passes
# them into decide() as an argument.
#
# LIVE SYSTEMS: this revision removes every M2 (regex) row from the table
# entirely (see below). A hosted database seeded from an older table does
# not pick this up automatically -- delete those rows from policy_rules by
# hand, or run reset_db.py if the data is disposable.
#
# The reason is the case study's own complaint: if changing "MyKad to a public
# AI tool" from redact to deny needs a git commit, we have rebuilt the exact
# governance gap we are supposed to be closing. A compliance officer cannot
# wait for a release. Changing a rule must be a row edit.
#
# Matching (M3's job, stated here only so the rows read sensibly):
#   data_class must match exactly.
#   ai_tool_tier, user_role, purpose accept "*" as a wildcard.
#   detector: "*" (default) matches regardless of which detector produced a
#     span; "embed" or "deberta" matches only that detector's own spans for
#     this class, with its OWN best-confidence and min_confidence gate. M8's
#     confidence is a cosine similarity; M9's is its sensitivity head's own
#     probability (the confidentiality-severity axis -- see deberta.py). They
#     are not the same scale, so a class judged by both detectors needs two
#     separate tables, not one shared min_confidence. Per data_class, a
#     winner is picked independently within each detector group present; the
#     class's outcome is the STRICTEST of those winners.
#   min_confidence: rule matches only if the best span confidence for this
#     class (from that rule's detector, or overall for "*") is >= it.
#     Defaults to 0.0 (always satisfied) when absent. All thresholds in this
#     file are ">=": an exact boundary value resolves to the stricter band.
#   content_department: "*" (default) always matches; "@cross" matches iff
#     Classification.content_department is set and differs from the
#     requester's department -- content_department itself comes from a
#     SEPARATE axis (M8's matched-chunk department / M9's department head),
#     independent of the min_confidence gate above, which only ever judges
#     confidentiality-severity. A literal department matches equality.
#     "@cross" rows would be more specific than "*" rows (one more
#     non-wildcard field) and would win outright over the same-department
#     "*" row whenever content is cross-department -- the engine still
#     supports this, but no @cross rows are seeded below right now, so
#     cross-department mismatch currently has NO effect on the verdict; it
#     is display/log only (dashboard column, cross_department_only filter).
#   require_purpose: "state & allow" flag. Defaults to false.
#   Most specific match wins (most non-wildcard fields, counting a
#     detector-scoped rule as one more non-wildcard field, higher
#     min_confidence breaking a tie); ties break toward the stricter verdict
#     (deny > hold > redact > allow). This tie-break is evaluated separately
#     within each detector's own candidate group.
#
# decision: allow | redact | hold | deny
#
# M2 HAS NO POLICY VOICE HERE (in policy_rules). MYKAD, EMAIL, PHONE,
# PERSON, BANK_ACCT, SALARY and API_KEY intentionally have NO rows in this
# table -- every span M2 (the regex detector) finds is a data_class with no
# matching rule, which resolves to allow via the no-candidate path in
# decide(). What actually protects that data is the engine's structural
# regex redaction floor: a span with detector == "rules" forces the
# decision from allow up to redact, unconditionally, regardless of tier,
# role, or purpose (see backend/app/policy/engine.py) -- PROVIDED its data
# class is in the redaction_classes table (dashboard: Policy & Tools ->
# Redaction). That table is separately admin-editable and seeded with all 7
# built-in M2 classes by default -- it is not this file, and not something
# M3/decide() reads a row for. This means M2 redacts what it finds by
# default, but never gets a vote in whether the request is held or
# denied -- a leaked credential (API_KEY) is redacted the same as a MyKad
# number, not escalated to deny, and no M2 class carries a require_purpose
# gate (the floor doesn't set one). An admin can remove a class from the
# Redaction list to stop M2 protecting it entirely -- a deliberate,
# real tradeoff, not a bug.
#
# DEPT_CONFIDENTIAL (M8/M9) is therefore the ONLY class with an actual
# policy row, and the only thing that can push a request to hold or deny.
# The floor still applies underneath it: if a regex span AND a DEPT_
# CONFIDENTIAL allow both apply, the request is redact, not allow (the
# floor upgrades allow -> redact). But if DEPT_CONFIDENTIAL's own tier says
# hold or deny, that stricter decision wins outright and nothing is sent at
# all -- the floor only ever upgrades allow, it never overrides hold/deny
# (see the REGEX FLOOR note in engine.py). Unlisted (class, tier) pairs
# resolve to allow via the no-candidate rule in decide(); the rows below are
# the complete intended policy for DEPT_CONFIDENTIAL.
#
# M11: DEPT_CONFIDENTIAL splits into two independent axes. Confidentiality-
# severity (M8's cosine similarity / M9's sensitivity-head confidence) sets
# the BASE tier below. Department attribution (M8's matched-chunk department
# / M9's department-head confidence) is judged separately and never gates
# severity on its own. content_department is still computed and logged on
# every request (dashboard column, cross_department_only filter), but
# cross-department escalation of the verdict itself (@cross rows) is
# currently disabled -- see the content_department note above. These bands
# reuse thresholds that have not been recalibrated against a gold eval set;
# do so before relying on them (see .env.example).

rules:
  # ---------- DEPT_CONFIDENTIAL, PUBLIC_AI: per-detector tiers ---------
  # M8 = cosine similarity vs indexed internal docs ("is this OUR doc?")
  #   < 0.50 allow (no row) | >=0.50 allow+justify | >=0.85 hold+justify
  #   | >=0.92 deny
  - {data_class: DEPT_CONFIDENTIAL, ai_tool_tier: PUBLIC_AI, user_role: "*", purpose: "*",
     detector: embed, min_confidence: 0.50, decision: allow, require_purpose: true}
  - {data_class: DEPT_CONFIDENTIAL, ai_tool_tier: PUBLIC_AI, user_role: "*", purpose: "*",
     detector: embed, min_confidence: 0.85, decision: hold,  require_purpose: true}
  - {data_class: DEPT_CONFIDENTIAL, ai_tool_tier: PUBLIC_AI, user_role: "*", purpose: "*",
     detector: embed, min_confidence: 0.92, decision: deny}

  # M9 = sensitivity-head confidence ("confidential in nature?"), independent
  # of how confident the department head is.
  #   < 0.65 allow (no row) | >=0.65 allow+justify | >=0.90 hold+justify
  #   | >=0.95 deny
  - {data_class: DEPT_CONFIDENTIAL, ai_tool_tier: PUBLIC_AI, user_role: "*", purpose: "*",
     detector: deberta, min_confidence: 0.65, decision: allow, require_purpose: true}
  - {data_class: DEPT_CONFIDENTIAL, ai_tool_tier: PUBLIC_AI, user_role: "*", purpose: "*",
     detector: deberta, min_confidence: 0.90, decision: hold,  require_purpose: true}
  - {data_class: DEPT_CONFIDENTIAL, ai_tool_tier: PUBLIC_AI, user_role: "*", purpose: "*",
     detector: deberta, min_confidence: 0.95, decision: deny}

  # Cross-department @cross rows disabled for now: content_department stays
  # display/log-only (dashboard column, cross_department_only filter) and
  # does not change the verdict. The rows above (data_class + tier + detector
  # only) already apply regardless of department match. Re-add @cross rows
  # here to bring escalation back if/when asked for.

  # ---------- DEPT_CONFIDENTIAL, ENTERPRISE_AI: one notch looser -------
  - {data_class: DEPT_CONFIDENTIAL, ai_tool_tier: ENTERPRISE_AI, user_role: "*", purpose: "*",
     detector: embed,   min_confidence: 0.50, decision: allow, require_purpose: true}
  - {data_class: DEPT_CONFIDENTIAL, ai_tool_tier: ENTERPRISE_AI, user_role: "*", purpose: "*",
     detector: deberta, min_confidence: 0.65, decision: allow, require_purpose: true}

  # ENTERPRISE_AI has no same-department hold/deny band at all (trusted one
  # notch looser than PUBLIC_AI). Cross-department escalation for this tier
  # is disabled for now too -- see the note above.

  # INTERNAL_AI DEPT_CONFIDENTIAL: allow (no row needed), cross-department
  # included -- the most-trusted tier stays untouched by this change.
